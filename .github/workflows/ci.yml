name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[research]"
      - name: Runtime demo
        run: python -m sar_runtime demo
      - name: Tests
        run: python -m pytest -q
      - name: Compile package
        run: python -m py_compile sar_runtime/*.py
